<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>REGISTRO ESTUDIANTIL</h1>

    <form id="formEstudiante">
        <label>Nombre:</label><br>
        <input type="text" id="nombre"><br><br>

        <label>NIE:</label><br>
        <input type="text" id="nie"><br><br>

        <label>Edad:</label><br>
        <input type="number" id="edad"><br><br>

        <label>Grado:</label><br>
        <select id="grado">
            <option value="">Seleccionar</option>
            <option value="1er Año">1er Año</option>
            <option value="2do Año">2do Año</option>
        </select><br><br>

        <label>Sección:</label><br>
        <select id="seccion">
            <option value="">Seleccionar</option>
            <option value="A">A</option>
            <option value="B">B</option>
        </select><br><br>

        <label>Correo:</label><br>
        <input type="email" id="correo"><br><br>

        <label>Teléfono:</label><br>
        <input type="text" id="telefono"><br><br>

        <button type="submit">REGISTRAR ESTUDIANTE</button>
    </form>

    <p id="mensajeAlerta" style="color: red;"></p>

    <h2>Datos del Estudiante Registrado:</h2>
    <div id="resultado"></div>

    <script>
        const formulario = document.getElementById('formEstudiante');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const nie = document.getElementById('nie').value;
            const edad = document.getElementById('edad').value;
            const grado = document.getElementById('grado').value;
            const seccion = document.getElementById('seccion').value;
            const correo = document.getElementById('correo').value;
            const telefono = document.getElementById('telefono').value;
            
            const mensajeAlerta = document.getElementById('mensajeAlerta');
            const resultado = document.getElementById('resultado');

            //Esta pequeña linea es lo que elimina el mensaje de alerta al no llenar algo o el de resultado.
            mensajeAlerta.textContent = '';
            resultado.innerHTML = '';

            //Por si acaso o por algun error se deja algun campo vacio esto deberia de mandar el mensaje de que se tienen que llenar todos los campos
            if (nombre === '' || nie === '' || edad === '' || grado === '' || seccion === '' || correo === '' || telefono === '') {
                mensajeAlerta.textContent = 'Debe completar todos los campos.';
                return;
            }

            //El mensajito que se muestra despues de haber ingresado los datos correctamente
            mensajeAlerta.style.color = 'green';
            mensajeAlerta.textContent = 'ESTUDIANTE REGISTRADO CORRECTAMENTE';

            //Esto Profe es lo que va a mostrar despues de haber ingresado las variables de ingreso de estudiante
            resultado.innerHTML = `
                <p><strong>Nombre completo:</strong> ${nombre}</p>
                <p><strong>NIE:</strong> ${nie}</p>
                <p><strong>Edad:</strong> ${edad}</p>
                <p><strong>Grado:</strong> ${grado}</p>
                <p><strong>Sección:</strong> ${seccion}</p>
                <p><strong>Correo:</strong> ${correo}</p>
                <p><strong>Teléfono:</strong> ${telefono}</p>
            `;
        });
    </script>

</body>
</html>
